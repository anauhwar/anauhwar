<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Akash Nauhwar — Senior Cloud and Data Engineer</title>
  <desc id="desc">A visual cloud data platform flowing from enterprise sources through pipelines and a lakehouse to analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#102650"/>
      <stop offset="1" stop-color="#123f55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40d9d4"/>
      <stop offset="0.55" stop-color="#4a80ff"/>
      <stop offset="1" stop-color="#9b6df0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#88a9c8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="42" r="180" fill="#35cec6" opacity=".07"/>
  <circle cx="1120" cy="300" r="205" fill="#8d67ef" opacity=".08"/>
  <rect x="62" y="62" width="58" height="58" rx="17" fill="#fff" opacity=".1" stroke="#6de4df"/>
  <text x="91" y="99" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">AN</text>
  <text x="62" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#ffffff">AKASH NAUHWAR</text>
  <text x="64" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#61ded9">SENIOR CLOUD &amp; DATA ENGINEER</text>
  <text x="64" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aebfd3">Azure  •  Databricks  •  Lakehouse  •  Observability  •  Enterprise Integration</text>
  <rect x="64" y="280" width="440" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <g transform="translate(700 54)" font-family="Segoe UI,Arial,sans-serif">
    <path d="M72 74 C138 74 130 121 196 121 S256 168 322 168" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".75"/>
    <path d="M72 174 C135 174 132 133 196 133" fill="none" stroke="#40d9d4" stroke-width="2" opacity=".55"/>
    <path d="M322 168 C376 168 378 118 432 118" fill="none" stroke="#9b6df0" stroke-width="3" opacity=".7"/>
    <g fill="#0d223b" stroke-width="2">
      <rect x="0" y="42" width="112" height="66" rx="14" stroke="#40d9d4"/>
      <rect x="0" y="142" width="112" height="66" rx="14" stroke="#40d9d4"/>
      <rect x="148" y="94" width="112" height="76" rx="16" stroke="#4a80ff"/>
      <rect x="286" y="130" width="112" height="76" rx="16" stroke="#697eff"/>
      <rect x="420" y="84" width="112" height="72" rx="16" stroke="#9b6df0"/>
    </g>
    <g fill="#dbe8f4" font-size="13" font-weight="600" text-anchor="middle">
      <text x="56" y="72">ENTERPRISE</text><text x="56" y="91" fill="#7f9ab5" font-size="11">SOURCES</text>
      <text x="56" y="172">EVENTS &amp; APIs</text><text x="56" y="191" fill="#7f9ab5" font-size="11">INGESTION</text>
      <text x="204" y="125">PIPELINES</text><text x="204" y="147" fill="#7f9ab5" font-size="11">ADF</text>
      <text x="342" y="161">LAKEHOUSE</text><text x="342" y="184" fill="#7f9ab5" font-size="11">DATABRICKS</text>
      <text x="476" y="115">DECISIONS</text><text x="476" y="136" fill="#7f9ab5" font-size="11">ANALYTICS</text>
    </g>
    <g fill="#6ee6df" filter="url(#glow)"><circle cx="125" cy="91" r="4"/><circle cx="274" cy="150" r="4"/><circle cx="410" cy="145" r="4"/></g>
  </g>
